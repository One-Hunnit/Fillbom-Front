name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai_review:
    runs-on: ubuntu-latest
    steps:
      # 1. PR 코드 체크아웃
      - name: Checkout PR code
        uses: actions/checkout@v3

      # 2. PR diff 생성 및 저장
      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} > pr.diff

      # 3. 변경 파일 수 / 라인 수 계산
      - name: Check PR size
        id: check_size
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} | wc -l)
          CHANGED_LINES=$(git diff --shortstat origin/${{ github.base_ref }} | grep -o '[0-9]\+' | paste -sd+ - | bc || echo 0)
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "changed_lines=$CHANGED_LINES" >> $GITHUB_OUTPUT

      # 4. OpenAI로 리뷰 요청
      - name: Review with OpenAI
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          PROMPT=$(cat .github/prompt/review.txt)
          DIFF=$(cat pr.diff | head -c 4000)
          FINAL_PROMPT="$PROMPT\n$DIFF"

          RAW_RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-3.5-turbo",
              "messages": [{"role": "user", "content": "'"${FINAL_PROMPT//$'\n'/\\n}"'"}]
            }')

          echo "==== GPT RAW RESPONSE ===="
          echo "$RAW_RESPONSE"

          RESPONSE=$(echo "$RAW_RESPONSE" | jq -r '.choices[0].message.content' || echo "")

          if [ -z "$RESPONSE" ] || [ "$RESPONSE" = "null" ]; then
            RESPONSE="(AI 응답이 비어 있거나 오류가 발생했습니다.)"
          fi

          echo "review=$RESPONSE" >> $GITHUB_OUTPUT

      # ✅ 5. Debug (항상 실행)
      - name: Debug response
        if: always()
        run: |
          echo "==== DEBUGGING GPT RESPONSE ===="
          echo "REVIEW OUTPUT: ${{ steps.review.outputs.review }}"

      # 6. PR에 리뷰 코멘트 작성 (빈 응답이면 스킵)
      - name: Comment on PR
        if: ${{ steps.review.outputs.review && steps.review.outputs.review != 'null' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🤖 **AI 코드 리뷰 요약 (GPT-3.5 기반)**  
            ```
            ${{ steps.review.outputs.review }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

      # 7. PR 크기 초과 시 경고 코멘트 작성
      - name: Warn if PR is too large
        if: ${{ steps.check_size.outputs.changed_files > 10 || steps.check_size.outputs.changed_lines > 500 }}
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "⚠️ **이 PR은 대형 변경입니다.**  
            - 변경된 파일 수: \`${{ steps.check_size.outputs.changed_files }}\`  
            - 변경된 라인 수: \`${{ steps.check_size.outputs.changed_lines }}\`

            리뷰 효율을 위해 가능하면 기능 단위로 더 작은 PR로 나눠주세요 🙏" \
            --repo ${{ github.repository }}
